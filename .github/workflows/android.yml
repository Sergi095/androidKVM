name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build installable test APK
        run: ./gradlew --no-daemon testGithubDebugUnitTest lintGithubDebug assembleGithubDebug
      - uses: actions/upload-artifact@v7
        with:
          name: androidKVM-debug
          path: app/build/outputs/apk/github/debug/app-github-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROIDKVM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROIDKVM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROIDKVM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROIDKVM_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/androidkvm-release.jks"
          echo "ANDROIDKVM_KEYSTORE=$RUNNER_TEMP/androidkvm-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          ANDROIDKVM_STORE_PASSWORD: ${{ secrets.ANDROIDKVM_STORE_PASSWORD }}
          ANDROIDKVM_KEY_ALIAS: ${{ secrets.ANDROIDKVM_KEY_ALIAS }}
          ANDROIDKVM_KEY_PASSWORD: ${{ secrets.ANDROIDKVM_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleGithubRelease
      - name: Verify tag and APK version
        run: |
          apk_version=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/github/release/app-github-release.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          test -n "$apk_version"
          test "$GITHUB_REF_NAME" = "v$apk_version"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk "androidKVM-${GITHUB_REF_NAME}.apk"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "androidKVM-${GITHUB_REF_NAME}.apk" --clobber
