plugins {
    id 'com.android.application'
}

android {
    namespace 'org.androidkvm.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'org.androidkvm.app'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '0.2.0'
    }

    signingConfigs {
        release {
            def keyFile = System.getenv('ANDROIDKVM_KEYSTORE')
            if (keyFile) {
                storeFile file(keyFile)
                storePassword System.getenv('ANDROIDKVM_STORE_PASSWORD')
                keyAlias System.getenv('ANDROIDKVM_KEY_ALIAS')
                keyPassword System.getenv('ANDROIDKVM_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.biometric:biometric:1.1.0'
}
